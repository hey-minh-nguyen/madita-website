<body>
<template id="dc-x">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF;color:#1E1E1E;font-family:"DM Sans",ui-sans-serif,system-ui,sans-serif}
a{color:#343DBA}a:hover{color:#101665}
.wrap{max-width:1200px;margin:0 auto;padding-left:32px;padding-right:32px;box-sizing:border-box}
.display{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;font-weight:800;letter-spacing:-0.02em;margin:0}
.lead{font-size:18px;line-height:1.6;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:9999px;font-size:15px;font-weight:600;text-decoration:none;box-sizing:border-box;font-family:inherit;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-main{background:#343DBA;color:#FFFFFF}.btn-main:hover{background:#2A3298;color:#FFFFFF}
.btn-outline{background:#FFFFFF;color:#1E1E1E;border-color:#1E1E1E}.btn-outline:hover{background:#1E1E1E;color:#FFFFFF}
.btn-dark{background:#1E1E1E;color:#FFFFFF}.btn-dark:hover{color:#FFFFFF;background:#343DBA}
.btn-lime{background:#D4F59A;color:#1E1E1E}.btn-lime:hover{color:#1E1E1E;background:#EEFFD5}
.eyebrow{display:inline-block;background:#ECF0FA;color:#343DBA;border-radius:9999px;padding:6px 14px;font-size:13px;font-weight:600}
.nav a{color:#1E1E1E;text-decoration:none;font-size:15px;font-weight:500}.nav a:hover{color:#343DBA}
.flink{color:#1E1E1E;text-decoration:none;font-size:14px}.flink:hover{color:#343DBA}
.ico{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ph{background:#EDEEF3;border:2px dashed #9397A9;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:#1E1E1E;font-size:14px;line-height:1.5;padding:24px;box-sizing:border-box}
.ph strong{font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
.field label{font-size:14px;font-weight:600}
.inp{min-height:48px;padding:0 16px;border-radius:5px;border:1px solid #9397A9;background:#FFFFFF;color:#1E1E1E;font-size:16px;font-family:inherit;box-sizing:border-box;width:100%}
.inp:focus{outline:2px solid #343DBA;outline-offset:1px;border-color:#343DBA}
@media (max-width:720px){.wrap{padding-left:16px;padding-right:16px}}
/* Navigation: Lime-Marker bei Hover, Klick und auf der aktiven Seite */
.nav a{padding:0 8px;margin:0 -8px;border-radius:3px;background-image:linear-gradient(#D4F59A,#D4F59A);background-repeat:no-repeat;background-position:0 50%;background-size:0% 1.6em;transition:background-size .35s cubic-bezier(.2,.8,.2,1),color .2s ease}
.nav a:is(:hover,:focus-visible,:active,[aria-current="page"]){background-size:100% 1.6em;color:#1E1E1E !important}
@media (prefers-reduced-motion:reduce){.nav a{transition:none}}
</style>
</helmet>
<div style="width:100%;min-width:0">

<header style="background:#FFFFFF;border-bottom:1px solid #EDEEF3">
<div class="wrap" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px;padding-top:18px;padding-bottom:18px">
<a href="index.html" aria-label="madita.ai Startseite" style="text-decoration:none;color:#1E1E1E">
<span class="display" style="font-size:26px">madita<span style="color:#343DBA">.ai</span></span>
</a>
<nav class="nav" aria-label="Hauptnavigation" style="display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center">
<a href="produkt.html">Produkt</a>

</nav>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
<span style="font-size:14px;font-weight:600">DE <span style="font-weight:400">/ EN</span></span>
<a href="#anmelden" style="color:#1E1E1E;text-decoration:none;font-size:15px;font-weight:500">Anmelden</a>
<a class="btn btn-dark" href="kontakt.html" aria-current="page">Kostenlos ausprobieren</a>
</div>
</div>
</header>

<section style="padding-top:72px;padding-bottom:104px;background:#ECF0FA">
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start">

<div style="flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:28px;align-items:flex-start">
<span class="eyebrow" style="background:#FFFFFF">Kostenlos ausprobieren</span>
<h1 class="display" style="font-size:clamp(40px,5vw,60px);line-height:1.05">Willkommen im Team. <span style="color:#343DBA">Starten Sie mit Madita.</span></h1>
<p class="lead">Ein paar kurze Angaben, dann melden wir uns. Die ersten 10 Interviews sind kostenlos, ohne Zahlungsdaten.</p>
<ol style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px">
<li style="display:flex;gap:16px;align-items:flex-start"><span class="display" style="flex:none;width:40px;height:40px;border-radius:9999px;background:#343DBA;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:18px">1</span><span style="font-size:16px;line-height:1.5;padding-top:8px"><strong>Formular ausfüllen.</strong> Dauert eine Minute.</span></li>
<li style="display:flex;gap:16px;align-items:flex-start"><span class="display" style="flex:none;width:40px;height:40px;border-radius:9999px;background:#343DBA;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:18px">2</span><span style="font-size:16px;line-height:1.5;padding-top:8px"><strong>Live-Demo.</strong> Wir führen ein Beispiel-Interview passend zu Ihrer Rolle durch.</span></li>
<li style="display:flex;gap:16px;align-items:flex-start"><span class="display" style="flex:none;width:40px;height:40px;border-radius:9999px;background:#343DBA;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:18px">3</span><span style="font-size:16px;line-height:1.5;padding-top:8px"><strong>Live in Tagen.</strong> ATS anbinden, Rolle einrichten, erste Interviews laufen.</span></li>
</ol>
<div class="ph" style="width:100%;min-height:300px;background:#FFFFFF">
<strong>Foto: Madita, funktional</strong>
<span>Geste „Hand zum Handschlag ausgestreckt“ (Willkommen),<br>grauer Hintergrund – neues Shooting Nov. 2026</span>
</div>
</div>

<div style="flex:1 1 520px;min-width:0;background:#FFFFFF;border-radius:15px;padding:clamp(24px,4vw,40px);box-sizing:border-box">
<sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{submit}}" style="display:flex;flex-direction:column;gap:20px">
<h2 class="display" style="font-size:26px">Ihre Angaben</h2>
<div style="display:flex;flex-wrap:wrap;gap:16px">
<div class="field"><label for="k-vor">Vorname *</label><input id="k-vor" class="inp" type="text" autocomplete="given-name" required></div>
<div class="field"><label for="k-nach">Nachname *</label><input id="k-nach" class="inp" type="text" autocomplete="family-name" required></div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:16px">
<div class="field"><label for="k-firma">Unternehmen *</label><input id="k-firma" class="inp" type="text" autocomplete="organization" required></div>
<div class="field"><label for="k-mail">Geschäftliche E-Mail *</label><input id="k-mail" class="inp" type="email" autocomplete="email" placeholder="name@unternehmen.de" required></div>
</div>
<div class="field"><label for="k-vol">Wie viele Interviews führen Sie pro Monat? *</label>
<select id="k-vol" class="inp" required>
<option value="">Bitte auswählen…</option>
<option>0 bis 24</option>
<option>25 bis 49</option>
<option>50 bis 249</option>
<option>250 bis 499</option>
<option>500 bis 999</option>
<option>1.000 bis 2.999</option>
<option>Über 3.000</option>
</select></div>
<div class="field"><label for="k-ats">Welches ATS nutzen Sie? *</label><input id="k-ats" class="inp" type="text" list="ats-list" placeholder="ATS suchen…" required>
<datalist id="ats-list"><option value="Teamtailor"></option><option value="d.vinci"></option><option value="SAP SuccessFactors"></option><option value="Workday"></option><option value="Anderes / keins"></option></datalist></div>
<div class="field"><label for="k-quelle">Wie haben Sie von uns erfahren? *</label>
<select id="k-quelle" class="inp" required>
<option value="">Bitte auswählen…</option>
<option>LinkedIn</option>
<option>Google / KI-Suche</option>
<option>Empfehlung</option>
<option>Veranstaltung (HeyDay, Zukunft Personal …)</option>
<option>HeyJobs Newsletter</option>
<option>Presse</option>
<option>Sonstiges</option>
</select></div>
<p style="margin:0;font-size:13px;line-height:1.5">Mit dem Absenden stimmen Sie der Verarbeitung Ihrer Angaben gemäß unserer <a href="#datenschutz">Datenschutzerklärung</a> zu.</p>
<button type="submit" class="btn btn-main" style="min-height:52px;font-size:16px">Demo anfragen</button>
</form>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:20px;align-items:flex-start">
<div class="ph" style="width:100%;min-height:260px">
<strong>Foto: Madita, funktional</strong>
<span>Geste „Daumen hoch“ (Erfolg)</span>
</div>
<div role="status" style="display:flex;align-items:center;gap:10px;border-radius:5px;background:#ECFDF5;padding:12px 16px;width:100%;box-sizing:border-box">
<span style="width:10px;height:10px;border-radius:9999px;background:#10B981;flex:none"></span>
<p style="margin:0;font-size:15px;font-weight:600;color:#047857">Anfrage gesendet.</p>
</div>
<h2 class="display" style="font-size:28px">Danke! Ich melde mich bei Ihnen.</h2>
<p style="margin:0;font-size:16px;line-height:1.6">Sie erhalten in Kürze eine E-Mail mit Terminvorschlägen für Ihre Demo. Bis dahin: Probieren Sie ein Interview aus Sicht Ihrer Kandidat:innen.</p>
<div style="display:flex;flex-wrap:wrap;gap:12px">
<a class="btn btn-main" href="index.html#test-interview">Zum Test-Interview</a>
<button type="button" class="btn btn-outline" onClick="{{reset}}">Formular erneut zeigen</button>
</div>
</div>
</sc-if>
</div>

</div>
</section>

<section style="padding-top:72px;padding-bottom:72px">
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:16px">
<a href="index.html#test-interview" style="flex:1 1 300px;text-decoration:none;color:#1E1E1E;background:#D4F59A;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:13px;color:#101665;font-weight:600">Ohne Konto</span>
<span class="display" style="font-size:22px;color:#101665">Test-Interview starten →</span>

<span style="font-size:13px;color:#101665;font-weight:600">Ab 20 € pro Interview</span>

</a>
<a href="compliance.html" style="flex:1 1 300px;text-decoration:none;color:#1E1E1E;background:#7ADEEE;border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:13px;color:#101665;font-weight:600">DSGVO &amp; EU AI Act</span>
<span class="display" style="font-size:22px;color:#101665">Sicherheit prüfen →</span>
</a>
</div>
</section>

<footer style="border-top:1px solid #EDEEF3">
<div class="wrap" style="display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;padding-top:20px;padding-bottom:20px;font-size:13px">
<span>© 2026 Madita · betrieben von der HeyJobs GmbH, Berlin</span>
<span><a class="flink" href="#impressum">Impressum</a> · <a class="flink" href="#datenschutz">Datenschutz</a> · <a class="flink" href="#agb">AGB</a></span>
</div>
</footer>

</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
renderVals() {
const sent = !!(this.state && this.state.sent);
return {
sent: sent,
showForm: !sent,
submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); },
reset: () => this.setState({ sent: false })
};
}
}
</script>
</body>
</html>
