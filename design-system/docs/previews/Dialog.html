<!doctype html>
<html lang="de">
<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../vendor/react.production.min.js"></script><script src="../vendor/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta name="robots" content="noindex"><style>body{margin:0;background:var(--surface)}</style><meta charset="utf-8"><title>Dialog – Vorschau</title></head>
<body>
<div id="root"></div>
<script>
  var M = window.Madita, h = React.createElement;
  function Demo() {
    var s = React.useState(true);
    return h(React.Fragment, null,
      h('div', { className: 'md-stage' }, h(M.Button, { onClick: function () { s[1](true); } }, 'Demo anfragen')),
      h(M.Dialog, { open: s[0], onClose: function () { s[1](false); }, title: 'Erleben Sie ein Interview mit Madita' },
        h('p', { className: 'md-lead', style: { marginBottom: 24 } }, 'Die Auswertung kommt per E-Mail.'),
        h(M.Field, { label: 'Firmen-E-Mail-Adresse', type: 'email', placeholder: 'name@firma.de' }),
        h('div', { style: { marginTop: 24 } }, h(M.Button, null, 'Interview starten'))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
