<!doctype html>
<html lang="de">
<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../vendor/react.production.min.js"></script><script src="../vendor/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta name="robots" content="noindex"><style>body{margin:0;background:var(--surface)}</style><meta charset="utf-8"><title>Icon – Vorschau</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; padding: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; border-radius: var(--radius-md); background: var(--grey-05); color: var(--ink); font-size: 11px; line-height: 1.3; text-align: center; overflow-wrap: anywhere; }
  .chip { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--grey); color: #fff; }
  .row { display: flex; gap: 12px; align-items: center; padding: 16px 16px 0; }
</style></head>
<body>
<div id="root"></div>
<script>
  var M = window.Madita, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h('div', { className: 'row' },
      h('span', { className: 'chip' }, h(M.Icon, { name: 'shield-check' })),
      h('span', { className: 'chip' }, h(M.Icon, { name: 'translate' })),
      h('span', { className: 'chip' }, h(M.Icon, { name: 'clock' })),
      h(M.Button, { variant: 'outline', icon: 'arrow' }, 'In jede Sprache reinhören')),
    h('div', { className: 'grid' }, M.Icon.names.map(function (n) {
      return h('div', { className: 'cell', key: n }, h(M.Icon, { name: n }), n);
    }))));
</script>
</body>
</html>
