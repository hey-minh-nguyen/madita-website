<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../vendor/react.production.min.js"></script><script src="../vendor/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta name="robots" content="noindex"><style>body{margin:0;background:var(--surface)}</style><meta charset="utf-8"><title>FeatureGrid – Vorschau</title></head>
<body>
<div id="root" style="width:1424px;padding:20px"></div>
<script>
  var M = window.Madita, h = React.createElement;
  var cards = [
    h(M.FeatureCard, { key: 1, tone: 'lime', title: '90 Sprachen', widget: h(M.WidgetLanguages) }, 'Ideal für internationales Recruiting. Sogar Schweizerdeutsch.'),
    h(M.FeatureCard, { key: 2, tone: 'mint', title: '24/7 verfügbar', widget: h(M.WidgetStatus, { items: [{ label: 'Interview abgeschlossen', value: '02:14' }, { label: 'Interview abgeschlossen', value: 'So 09:40' }, { label: 'Interview abgeschlossen', value: '22:57' }] }) }, 'Fällt nie aus. Keine Krankheitstage, keine Pausen.'),
    h(M.FeatureCard, { key: 3, tone: 'turquoise', title: 'Unbegrenzt skalierbar', widget: h(M.WidgetChart, { values: [20, 26, 37, 60, 86, 109] }) }, 'Ob 10 oder 10.000 Interviews pro Monat.'),
    h(M.FeatureCard, { key: 4, tone: 'sky-blue', title: 'DSGVO-konform', widget: h(M.WidgetChecklist, { items: ['DSGVO · AVV und TOMs', 'EU AI Act', 'Hosting in Frankfurt', 'Unterlagen Betriebsrat'] }) }, 'In Deutschland gebaut. Volle Compliance ab Tag eins.'),
    h(M.FeatureCard, { key: 5, tone: 'indigo', title: 'Jede Rolle, von Blue-Collar bis Führung', action: h(M.Button, { variant: 'inverse' }, 'Kostenlos ausprobieren') })
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(M.FeatureGrid, null, cards));
</script>
